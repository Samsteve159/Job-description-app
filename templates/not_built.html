{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block body %}
<div class="empty panel">
  <h2>{{ heading }}</h2>
  <p class="lead" style="margin: 0 auto 18px;">{{ why }}</p>
  {% if blocked_on %}
  <div style="max-width: 460px; margin: 0 auto; text-align: left;">
    <h3>Needed before this can be built</h3>
    <ul style="color: var(--muted); font-size: 14px;">
      {% for item in blocked_on %}<li>{{ item }}</li>{% endfor %}
    </ul>
  </div>
  {% endif %}
</div>
{% endblock %}
